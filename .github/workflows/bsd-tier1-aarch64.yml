#
# Cross-build NetBSD/aarch64, then run tier1 on a real NetBSD/aarch64.
#
# The x86_64 tier1 workflow beside this one boots its guest on an x86_64
# runner, where the guest matches the host and KVM does the work.  This one
# asks for an arm64 runner on the same reasoning -- and that reasoning does
# not hold: measured on 2026-09-23 against an x86_64 runner as a control,
# ubuntu-24.04-arm has no /dev/kvm, so an aarch64 guest is emulated there
# too.  qemu-system-aarch64 on that runner still lists kvm under
# -accel help, which describes how the binary was built rather than what
# the host offers, so the flag is no evidence either way.
#
# It is left on the arm64 runner because that is where tier1 has been run
# and measured; whether an x86_64 runner does as well has not been tried.
# The probe below prints what the host actually has, so the next run says
# rather than assumes.
#
# The release matches the x86_64 side so the two sets of results can be
# read against each other.  vmactions publishes a NetBSD 10.1 aarch64 image
# as well as an 11.0 one, so either would boot.
#
name: 'BSD tier1 (aarch64)'

on:
  push:
    branches:
      - tier1-bsd-aarch64-11
  workflow_dispatch:
    inputs:
      release:
        description: 'NetBSD release to run the tests in'
        required: false
        default: '10.1'

concurrency:
  group: bsd-tier1-aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 11's get-jtreg builds jtreg in the test job itself rather than fetching
  # an artifact, so there is no preparation job to run first here.
  build:
    name: build
    uses: ./.github/workflows/build-bsd.yml
    with:
      targets: >-
        {"include":[
          {"target-os":"netbsd","arch":"aarch64",
           "target-triple":"aarch64-unknown-netbsd",
           "conf-name":"bsd-aarch64-netbsd"}]}

  test:
    name: test
    needs: [build]
    uses: ./.github/workflows/test-bsd.yml
    with:
      target-os: 'netbsd'
      platform: 'bsd-aarch64-netbsd'
      arch: 'aarch64'
      runner: 'ubuntu-24.04-arm'
      release: ${{ inputs.release || '10.1' }}
