#
# Cross-build every BSD on every machine this tree can target, then run
# tier1 on each BSD and machine a virtual machine can be booted for.
#
# x86_64, aarch64 and 64-bit PowerPC (FreeBSD and OpenBSD, which use the
# ELFv2 ABI there; NetBSD's is ELFv1) have HotSpot ports on the BSDs; i386,
# sparc64, armv7 and riscv64 do not, and are built as Zero, which calls
# through libffi from the OS's packages.  DragonFly is x86_64 only.  NetBSD builds against
# 10.1 but for riscv64, whose first release is 11.0; the reasons are in
# gen-bsd-sysroot.sh.  NetBSD is also built once with the desktop modules,
# which pull in X11 and are otherwise left out.
#
# tier1 runs from the bundles the build uploaded, in a VM of the same
# release, eleven parts per machine.  The Zero machines stop at the build:
# no image boots them fast enough to run tier1 in a hosted job.
#
name: 'BSD all'

on:
  push:
    branches:
      - claude/eloquent-dirac-pfg00n
  workflow_dispatch:

# No run-wide concurrency: a push would then cancel tier1, which takes
# hours, every time a fix went in, and no run would ever finish one.  A
# newer push cancels the builds of an older one, and each machine's tier1
# is never cancelled once it starts; a newer one waits for it, and only the
# newest waiting one runs.
jobs:
  hotspot:
    name: hotspot
    concurrency:
      group: bsd-build-hotspot-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/build-bsd.yml
    with:
      targets: >-
        {"include":[
          {"target-os":"netbsd","arch":"x86_64",
           "target-triple":"x86_64-unknown-netbsd",
           "conf-name":"bsd-x86_64-netbsd"},
          {"target-os":"freebsd","arch":"x86_64",
           "target-triple":"x86_64-unknown-freebsd15.1",
           "conf-name":"bsd-x86_64-freebsd"},
          {"target-os":"openbsd","arch":"x86_64",
           "target-triple":"x86_64-unknown-openbsd7.9",
           "conf-name":"bsd-x86_64-openbsd"},
          {"target-os":"dragonfly","arch":"x86_64",
           "target-triple":"x86_64-unknown-dragonfly",
           "conf-name":"bsd-x86_64-dragonfly"},
          {"target-os":"netbsd","arch":"aarch64",
           "target-triple":"aarch64-unknown-netbsd",
           "conf-name":"bsd-aarch64-netbsd"},
          {"target-os":"freebsd","arch":"aarch64",
           "target-triple":"aarch64-unknown-freebsd15.1",
           "conf-name":"bsd-aarch64-freebsd"},
          {"target-os":"openbsd","arch":"aarch64",
           "target-triple":"aarch64-unknown-openbsd7.9",
           "conf-name":"bsd-aarch64-openbsd",
           "llvm-suffix":"-21"},
          {"target-os":"freebsd","arch":"powerpc64",
           "target-triple":"powerpc64-unknown-freebsd15.1",
           "conf-name":"bsd-powerpc64-freebsd"},
          {"target-os":"freebsd","arch":"powerpc64le",
           "target-triple":"powerpc64le-unknown-freebsd15.1",
           "conf-name":"bsd-powerpc64le-freebsd"},
          {"target-os":"openbsd","arch":"powerpc64",
           "target-triple":"powerpc64-unknown-openbsd7.9",
           "conf-name":"bsd-powerpc64-openbsd",
           "llvm-suffix":"-20"}]}

  zero:
    name: zero
    concurrency:
      group: bsd-build-zero-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/build-bsd.yml
    with:
      extra-conf-options: '--with-jvm-variants=zero'
      targets: >-
        {"include":[
          {"target-os":"netbsd","arch":"i386",
           "target-triple":"i386-unknown-netbsd",
           "conf-name":"bsd-i386-netbsd",
           "extra-configure":"--with-libffi-include=$PWD/sysroot/usr/pkg/include --with-libffi-lib=$PWD/sysroot/usr/pkg/lib"},
          {"target-os":"openbsd","arch":"i386",
           "target-triple":"i386-unknown-openbsd7.9",
           "conf-name":"bsd-i386-openbsd",
           "llvm-suffix":"-20",
           "extra-configure":"--with-libffi-include=$PWD/sysroot/usr/local/include --with-libffi-lib=$PWD/sysroot/usr/local/lib"},
          {"target-os":"netbsd","arch":"sparc64",
           "target-triple":"sparc64-unknown-netbsd",
           "conf-name":"bsd-sparc64-netbsd",
           "extra-configure":"--with-libffi-include=$PWD/sysroot/usr/pkg/include --with-libffi-lib=$PWD/sysroot/usr/pkg/lib --with-extra-cflags=-mcmodel=medany --with-extra-cxxflags=-mcmodel=medany"},
          {"target-os":"openbsd","arch":"sparc64",
           "target-triple":"sparc64-unknown-openbsd7.9",
           "conf-name":"bsd-sparc64-openbsd",
           "extra-configure":"--with-libffi-include=$PWD/sysroot/usr/local/include --with-libffi-lib=$PWD/sysroot/usr/local/lib --with-extra-cflags=-mcmodel=medany --with-extra-cxxflags=-mcmodel=medany"},
          {"target-os":"netbsd","arch":"armv7",
           "target-triple":"armv7-unknown-netbsd-eabihf",
           "conf-name":"bsd-arm-netbsd",
           "llvm-suffix":"-21",
           "extra-configure":"--with-libffi-include=$PWD/sysroot/usr/pkg/include --with-libffi-lib=$PWD/sysroot/usr/pkg/lib"},
          {"target-os":"openbsd","arch":"armv7",
           "target-triple":"armv7-unknown-openbsd7.9",
           "conf-name":"bsd-arm-openbsd",
           "llvm-suffix":"-21",
           "extra-configure":"--with-libffi-include=$PWD/sysroot/usr/local/include --with-libffi-lib=$PWD/sysroot/usr/local/lib"},
          {"target-os":"netbsd","arch":"riscv64",
           "target-triple":"riscv64-unknown-netbsd",
           "conf-name":"bsd-riscv64-netbsd",
           "extra-configure":"--with-libffi-include=$PWD/sysroot/usr/pkg/include --with-libffi-lib=$PWD/sysroot/usr/pkg/lib"},
          {"target-os":"openbsd","arch":"riscv64",
           "target-triple":"riscv64-unknown-openbsd7.9",
           "conf-name":"bsd-riscv64-openbsd",
           "extra-configure":"--with-libffi-include=$PWD/sysroot/usr/local/include --with-libffi-lib=$PWD/sysroot/usr/local/lib"}]}

  headful:
    name: headful
    concurrency:
      group: bsd-build-headful-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/build-bsd.yml
    with:
      targets: >-
        {"include":[
          {"target-os":"netbsd","arch":"x86_64",
           "target-triple":"x86_64-unknown-netbsd",
           "conf-name":"bsd-x86_64-netbsd-headful",
           "extra-configure":"--disable-headless-only --x-includes=$PWD/sysroot/usr/X11R7/include --x-libraries=$PWD/sysroot/usr/X11R7/lib"}]}

  # 11's get-jtreg builds jtreg in the test job itself, from a cache when it
  # can, so there is no preparation job for tier1 to wait for.

  # Each machine is tested whether or not the others built.  One whose
  # build failed would otherwise still get its eleven tier1 jobs, each
  # waiting for a runner only to fail at fetching bundles that were never
  # uploaded -- 66 of the 77 in one run, on a queue that is the slowest
  # part of the loop.  So list this run's artifacts and keep the machines
  # whose bundles are there.
  built:
    name: built
    needs: [hotspot]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      machines: ${{ steps.pick.outputs.machines }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - name: 'Pick the machines that built'
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          ALL: >-
            [
            {"os":"netbsd",   "arch":"",       "platform":"bsd-x86_64-netbsd",   "release":"10.1", "runner":"ubuntu-24.04"},
            {"os":"freebsd",  "arch":"",       "platform":"bsd-x86_64-freebsd",  "release":"15.1", "runner":"ubuntu-24.04"},
            {"os":"openbsd",  "arch":"",       "platform":"bsd-x86_64-openbsd",  "release":"7.9",  "runner":"ubuntu-24.04"},
            {"os":"dragonfly","arch":"",       "platform":"bsd-x86_64-dragonfly","release":"6.4.2","runner":"ubuntu-24.04"},
            {"os":"netbsd",   "arch":"aarch64","platform":"bsd-aarch64-netbsd",  "release":"10.1", "runner":"ubuntu-24.04-arm"},
            {"os":"freebsd",  "arch":"aarch64","platform":"bsd-aarch64-freebsd", "release":"15.1", "runner":"ubuntu-24.04-arm"},
            {"os":"openbsd",  "arch":"aarch64","platform":"bsd-aarch64-openbsd", "release":"7.9",  "runner":"ubuntu-24.04-arm"}]
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[].name' > names.txt
          echo "artifacts of this run:"; sed 's/^/  /' names.txt
          m=$(echo "$ALL" | jq -c --rawfile n names.txt \
                '[.[] | select(("bundles-" + .platform) as $b
                               | ($n | split("\n") | index($b)) != null)]')
          echo "machines=$m" >> "$GITHUB_OUTPUT"
          if [ "$m" = "[]" ]; then echo "any=false"; else echo "any=true"; fi >> "$GITHUB_OUTPUT"
          echo "tier1 runs on: $m"

  # A guest whose machine differs from the runner's is emulated, so the
  # aarch64 ones go on an arm64 runner; that runner has no /dev/kvm either,
  # so they are emulated there too, only less so.
  tier1:
    name: tier1
    needs: [built]
    if: ${{ !cancelled() && needs.built.outputs.any == 'true' }}
    concurrency:
      group: bsd-tier1-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.built.outputs.machines) }}
    uses: ./.github/workflows/test-bsd.yml
    with:
      target-os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      release: ${{ matrix.release }}
